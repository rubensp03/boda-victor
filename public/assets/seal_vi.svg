<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Pearlescent wax body gradient -->
    <radialGradient id="waxBody" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="30%"  stop-color="#F2EDE8"/>
      <stop offset="70%"  stop-color="#DDD5CB"/>
      <stop offset="100%" stop-color="#C8BBAF"/>
    </radialGradient>

    <!-- Top-left gloss -->
    <radialGradient id="gloss" cx="30%" cy="25%" r="40%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Pearl bead gradient -->
    <radialGradient id="pearl" cx="33%" cy="28%" r="55%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#E8E0D4"/>
      <stop offset="100%" stop-color="#C4B8AC"/>
    </radialGradient>

    <!-- Outer drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#9A8070" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- === WAX BLOB — organic imperfect circle === -->
  <g filter="url(#shadow)">
    <path d="
      M 100,12
      C 122,8  144,15  158,30
      C 174,46  180,70  177,92
      C 174,115 162,137 144,150
      C 127,163 104,168 82,163
      C 60,158  40,143  30,123
      C 20,103  19,78   28,57
      C 38,36   58,18   80,13
      C 87,11   94,11   100,12 Z
    "
    fill="url(#waxBody)"/>
  </g>

  <!-- Gloss overlay -->
  <path d="
    M 100,12
    C 122,8  144,15  158,30
    C 174,46  180,70  177,92
    C 174,115 162,137 144,150
    C 127,163 104,168 82,163
    C 60,158  40,143  30,123
    C 20,103  19,78   28,57
    C 38,36   58,18   80,13
    C 87,11   94,11   100,12 Z
  "
  fill="url(#gloss)"/>

  <!-- === EMBOSSED RIM RING === -->
  <ellipse cx="100" cy="92" rx="56" ry="55" fill="none"
           stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="100" cy="92" rx="53" ry="52" fill="none"
           stroke="#C0AFA0" stroke-width="1" opacity="0.45"/>

  <!-- === CUPID MOTIF (simple, elegant) === -->
  <g transform="translate(100, 52)" fill="#C03040" opacity="0.85">
    <!-- Body -->
    <ellipse cx="0" cy="4" rx="5.5" ry="6.5"/>
    <!-- Head -->
    <circle cx="0" cy="-7" r="5"/>
    <!-- Wings -->
    <path d="M-6,1 Q-15,-6 -12,-14 Q-6,-8 -6,1Z"/>
    <path d="M 6,1 Q 15,-6  12,-14 Q 6,-8  6,1Z"/>
    <!-- Arrow -->
    <line x1="-13" y1="7" x2="13" y2="-3" stroke="#C03040" stroke-width="1.2"/>
    <polygon points="13,-3 8,-6 12,3"/>
    <polygon points="-13,7 -9,3 -10,13"/>
  </g>

  <!-- === V&I MONOGRAM === -->
  <!-- Shadow -->
  <text
    x="101" y="108"
    text-anchor="middle" dominant-baseline="middle"
    font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif"
    font-size="44" font-style="italic"
    fill="#A89080" opacity="0.5">V&amp;I</text>
  <!-- Main -->
  <text
    x="100" y="106"
    text-anchor="middle" dominant-baseline="middle"
    font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif"
    font-size="44" font-style="italic"
    fill="#E8DDD4">V&amp;I</text>
  <!-- Highlight -->
  <text
    x="99" y="104"
    text-anchor="middle" dominant-baseline="middle"
    font-family="'Palatino Linotype', Georgia, 'Times New Roman', serif"
    font-size="44" font-style="italic"
    fill="#FFFFFF" opacity="0.35">V&amp;I</text>

  <!-- === PEARL ARC beneath the seal === -->
  <!-- String -->
  <path d="M 30,160 Q 100,178 170,160"
        fill="none" stroke="#D8CFC4" stroke-width="0.8" opacity="0.7"/>
  <!-- Pearls -->
  <circle cx="30"  cy="160" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="47"  cy="167" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="64"  cy="172" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="82"  cy="176" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="100" cy="177" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="118" cy="176" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="136" cy="172" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="153" cy="167" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>
  <circle cx="170" cy="160" r="5" fill="url(#pearl)" stroke="#EDE5DC" stroke-width="0.4"/>

  <!-- Top gloss accent -->
  <ellipse cx="86" cy="56" rx="24" ry="13" fill="white" opacity="0.18" transform="rotate(-22,86,56)"/>
</svg>
